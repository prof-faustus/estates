name: CI

# Builds the native ESTATES app and runs the conformance suite on every push + PR, so the
# repository carries a visible, verifiable status check tied to the exact commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build apps/native/Estates.App/Estates.App.csproj -c Release

      - name: Conformance (positive + hostile-negative assertions)
        run: dotnet run --project apps/native/Estates.Conformance/Estates.Conformance.csproj -c Release
