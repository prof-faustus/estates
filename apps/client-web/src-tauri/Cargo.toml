[package]
name = "estates-desktop"
version = "0.1.0"
description = "ESTATES — dealerless on-chain property game (desktop shell)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "estates_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
